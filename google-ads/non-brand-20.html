<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="https://www.revenuagency.io" class="brand-logo">REVENU</a>
      <nav class="platform-nav" aria-label="Platform">
        <a href="/linkedin-ads" class="platform-pill" data-platform="linkedin">LinkedIn Ads</a>
        <a href="/google-ads" class="platform-pill is-active" data-platform="google">Google Ads</a>
        <a href="/landing-pages" class="platform-pill" data-platform="landing">Landing Pages</a>
        <a href="/saved" class="platform-pill platform-pill-saved" data-platform="saved" aria-label="Saved ads" title="Saved ads">

        <!-- Signed-in profile chip + popover (hidden until /api/linkedin?action=me confirms a session). -->

          <button class="user-chip" id="user-chip" type="button" title="Your profile">
            <img class="user-pic" id="user-pic" alt="" hidden />

            <span id="user-first"></span>
            <span class="udot"></span>
          </button>
          <div class="profile-pop" id="profile-pop" hidden>
            <div class="pp-top">
              <img class="pp-pic" id="pp-pic" alt="" hidden />
              <div class="pp-id">
                <div class="pp-name" id="pp-name"></div>
                <div class="pp-email" id="pp-email"></div>
              </div>
            </div>
            <div class="pp-rows">
              <div class="pp-row"><span class="pp-ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.55V9h3.57v11.45z"/></svg></span>Signed in with LinkedIn</div>

  <section class="hero">

    </div>
  </section>

  <div class="filters-wrap" id="filters-wrap">
    <div class="container">
      <div class="tabs" id="filters" role="tablist"></div>
      <!-- Shuffle button: desktop pins it absolute-left; mobile flex order puts it left of the filter -->
      <button class="shuffle-btn" id="shuffle-btn" type="button" aria-label="Shuffle order" title="Shuffle">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="21 3 21 9 15 9"></polyline>
          <polyline points="3 21 3 15 9 15"></polyline>
          <path d="M3.5 9a9 9 0 0 1 15-3.5L21 9"></path>
          <path d="M20.5 15a9 9 0 0 1-15 3.5L3 15"></path>
        </svg>
      </button>
      <!-- Desktop-only favorites filter: toggle to restrict the gallery to favorited ads. -->
      <button class="favorites-filter-btn" id="favorites-filter-btn" type="button" aria-label="Show favorites" title="Favorites">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <!-- Desktop-only search: collapsed = icon, expanded = inline input. Green dot when a query is active. -->
      <div class="search-control" id="search-control">
        <button class="search-btn" id="search-btn" type="button" aria-label="Search" title="Search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <span class="search-indicator" id="search-indicator" hidden></span>
        </button>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search…"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
      <div class="dropdown filter-dropdown" id="filter-dropdown">
        <button class="dropdown-trigger" type="button" id="filter-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="dropdown-label" id="filter-dropdown-label"></span>
          <span class="dropdown-chevron" aria-hidden="true"></span>
        </button>
        <div class="dropdown-menu" id="filter-dropdown-menu" role="listbox"></div>
      </div>
      <!-- Desktop-only column toggle -->
      <div class="view-toggle" id="view-toggle" role="radiogroup" aria-label="Column count">
        <button class="view-toggle-btn" type="button" role="radio" data-cols="1" aria-label="1 column" title="1 column">

        <button class="view-toggle-btn is-active" type="button" role="radio" data-cols="3" aria-label="3 columns" title="3 columns">
          <svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect x="0" y="0" width="3" height="12" rx="1"/><rect x="5.5" y="0" width="3" height="12" rx="1"/><rect x="11" y="0" width="3" height="12" rx="1"/></svg>
        </button>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- Homepage chooser: shown only when pathname is "/". Three tiles linking
         to each platform's library. Same border + shadow as gallery cards. -->
    <section class="chooser" id="chooser" hidden aria-label="Choose a library">
      <a class="chooser-tile" href="/linkedin-ads" data-platform="linkedin" aria-label="Browse the LinkedIn Ads library">
        <img src="images/Homepage/linkedin-ads.webp" alt="LinkedIn Ads library" loading="eager" />
      </a>
      <a class="chooser-tile" href="/google-ads" data-platform="google" aria-label="Browse the Google Ads library">
        <img src="images/Homepage/google-ads.webp" alt="Google Ads library" loading="eager" />
      </a>
      <a class="chooser-tile" href="/landing-pages" data-platform="landing" aria-label="Browse the Landing Pages library">
        <img src="images/Homepage/landing-pages.webp" alt="Landing Pages library" loading="eager" />
      </a>
    </section>
    <div id="gallery" class="gallery" aria-live="polite"></div>
    <p id="empty-state" class="empty-state" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© Revenu</p>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Ad preview" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next">›</button>
    <figure class="lb-figure">
      <img id="lb-image" alt="" />
      <figcaption id="lb-caption"></figcaption>
    </figure>
  </div>

  <!-- Sign-in gate. Blocks every page until the visitor authenticates with
       LinkedIn. The static HTML keeps full content + meta + JSON-LD for SEO;
       this overlay is a JS-rendered modal layered on top for human visitors. -->
  <div class="signin-gate" id="signin-gate" hidden>
    <div class="connect-card" id="connect-card">
      <button class="li-signin" id="signin-btn" type="button">Sign in with LinkedIn</button>
      <button class="in-tile" id="signin-btn-tile" type="button" aria-label="Sign in with LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.55V9h3.57v11.45z"/></svg>
      </button>
      <p class="signin-sub" id="signin-sub">One click, no passwords.<br>Get started for free.</p>
    </div>
    <div class="signin-err" id="signin-err" hidden></div>
  </div>
